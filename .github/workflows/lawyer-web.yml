name: Publicar lawyer (web)

on:
  push:
    branches: [main, claude/lawyer-client-registration-app-4frzl1]
    paths: ['lawyer/**', 'pedropixel/**', 'site/**', 'scripts/build-site.sh', '.github/workflows/lawyer-web.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lawyer-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lawyer/package-lock.json

      - run: npm ci
        working-directory: lawyer

      - run: npx tsc --noEmit
        working-directory: lawyer

      # Mesmo site do Netlify (scripts/build-site.sh), aqui dentro de /apps:
      # /apps/ (início), /apps/lawyer/ (app) e /apps/links/ (bio).
      - name: Gerar site
        env:
          SITE_PREFIX: /apps
        run: bash scripts/build-site.sh dist-site

      - name: Publicar no branch gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist-site
          publish_branch: gh-pages
          force_orphan: true
