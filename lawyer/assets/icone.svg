<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Fonte do ícone do app. Os PNGs em assets/ são gerados a partir deste arquivo. -->
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E3D63"/>
      <stop offset="1" stop-color="#1A2338"/>
    </linearGradient>
    <linearGradient id="terno" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2F3B"/>
      <stop offset="1" stop-color="#151922"/>
    </linearGradient>
    <clipPath id="quadro"><rect width="1024" height="1024"/></clipPath>
  </defs>

  <g id="fundo-layer">
    <rect width="1024" height="1024" fill="url(#fundo)"/>
    <circle cx="512" cy="540" r="400" fill="none" stroke="#B08D57" stroke-opacity="0.7" stroke-width="10"/>
  </g>

  <g id="advogado" clip-path="url(#quadro)">
    <!-- paletó -->
    <path d="M150 1024 C150 830 270 735 420 712 L512 700 L604 712 C754 735 874 830 874 1024 Z" fill="url(#terno)"/>
    <!-- pescoço -->
