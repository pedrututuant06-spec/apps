    <!-- gravata -->
    <path d="M488 752 L536 752 L528 800 L496 800 Z" fill="#9C7646"/>
    <path d="M496 800 L528 800 L556 935 L512 990 L468 935 Z" fill="#B08D57"/>
    <!-- lapelas -->
    <path d="M418 712 L512 905 L470 1024 L430 1024 L455 900 L372 770 Z" fill="#323846"/>
    <path d="M606 712 L512 905 L554 1024 L594 1024 L569 900 L652 770 Z" fill="#323846"/>
    <!-- lenço no bolso -->
    <path d="M690 905 L760 890 L762 912 L692 925 Z" fill="#B08D57"/>
    <!-- orelhas -->
    <ellipse cx="368" cy="470" rx="30" ry="48" fill="#D49F7D"/>
    <ellipse cx="656" cy="470" rx="30" ry="48" fill="#D49F7D"/>
